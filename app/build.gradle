plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.rostoll.ashportpda'
    compileSdk 34

    defaultConfig {
        applicationId "com.rostoll.ashportpda"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file(localProps.getProperty('RELEASE_STORE_FILE', System.getProperty("user.home") + "/ashport-pass.keystore"))
            storePassword localProps.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias localProps.getProperty('RELEASE_KEY_ALIAS', 'ashportkey')
            keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
