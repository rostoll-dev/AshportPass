plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rostoll.ashportpda'
    compileSdk 34

    defaultConfig {
        applicationId "com.rostoll.ashportpda"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.0.7"
    }

    signingConfigs {
        release {
            storeFile file("/data/data/com.termux/files/home/ashport-pass.keystore")
            storePassword "AshportPassSecret2026"
            keyAlias "ashportpass"
            keyPassword "AshportPassSecret2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
